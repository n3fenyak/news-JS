<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>NewsPortal</title>
</head>

<body>
    <header>
        <h1>News Portal</h1>
    </header>
    <main>
        <section class="sources-panel" aria-label="News sources">
            <h2 class="sources-panel__title">News Sources</h2>
            <div class="sources buttons"></div>
        </section>

        <section class="news-section" aria-label="Latest news">
            <div class="news"></div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__inner">
            <a class="footer__github" href="https://github.com/n3fenyak" target="_blank" rel="noopener noreferrer">
                n3fenyak
            </a>

            <a class="footer__logo" href="https://rs.school/" target="_blank" rel="noopener noreferrer">
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RSSchool" width="90"
                    height="36" />
            </a>

            <p class="footer__copy">
                © 2026 ·
                <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">
                    NewsAPI
                </a>
            </p>
        </div>
    </footer>

    <template id="sourceItemTemp">
        <div class="source__item">
            <span class="source__item-name"></span>
        </div>
    </template>

    <template id="newsItemTemp">
        <div class="news__item">
            <div class="news__meta">
                <div class="news__meta-photo"></div>
                <ul class="news__meta-details">
                    <li class="news__meta-author"></li>
                    <li class="news__meta-date"></li>
                </ul>
            </div>
            <div class="news__description">
                <h2 class="news__description-title"></h2>
                <h3 class="news__description-source"></h3>
                <p class="news__description-content"></p>
                <p class="news__read-more">
                    <a href="#">Read More</a>
                </p>
            </div>
        </div>
    </template>
</body>

</html>
